services:
  - type: web
    name: dorado-lounge-socket
    env: node
    plan: starter # RECOMENDACIÓN: El plan free hiberna y mata los WebSockets
    # 1. Compilamos TODO el monorepo para asegurar que las dependencias compartidas existan
    buildCommand: corepack enable && corepack prepare pnpm@10.33.2 --activate && pnpm install --frozen-lockfile && pnpm build
    # 2. Ejecutamos desde el directorio del paquete para que Node resuelva bien las rutas relativas
    startCommand: cd apps/socket-server && node dist/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # ... tus otras variables de entorno
