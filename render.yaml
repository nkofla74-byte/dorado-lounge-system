services:
  - type: web
    name: dorado-lounge-socket
    env: node
    # Sala 24/7: plan starter — sin hibernación, mantiene WebSockets vivos.
    plan: starter
    # Build de todo el monorepo: garantiza que workspace deps (@dorado/shared-types)
    # se compilen antes que socket-server las consuma.
    buildCommand: corepack enable && corepack prepare pnpm@10.33.2 --activate && pnpm install --frozen-lockfile && pnpm build
    # cd al paquete para que Node resuelva bien rutas relativas.
    startCommand: cd apps/socket-server && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SOCKET_EMIT_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: AXIOM_TOKEN
        sync: false
      - key: AXIOM_DATASET
        sync: false
