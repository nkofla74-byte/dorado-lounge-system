name: Database Backup

on:
  schedule:
    # Diario a las 03:00 UTC (22:00 hora Colombia)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Razón del backup manual'
        required: false
        default: 'Manual trigger'

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: pg_dump → Artifact + S3
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install postgresql-client
        run: sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Set timestamp
        id: ts
        run: echo "stamp=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - name: Dump database
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pg_dump \
            --host="${{ secrets.SUPABASE_DB_HOST }}" \
            --port=5432 \
            --username=postgres \
            --dbname=postgres \
            --no-password \
            --format=custom \
            --compress=9 \
            --file="backup-${{ steps.ts.outputs.stamp }}.pgdump"

      - name: Verify dump is non-empty
        run: |
          SIZE=$(stat -c%s "backup-${{ steps.ts.outputs.stamp }}.pgdump")
          echo "Backup size: ${SIZE} bytes"
          if [ "$SIZE" -lt 1024 ]; then
            echo "::error::Backup file is suspiciously small (${SIZE} bytes)"
            exit 1
          fi

      - name: Upload to GitHub Artifacts (30 días)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ steps.ts.outputs.stamp }}
          path: backup-${{ steps.ts.outputs.stamp }}.pgdump
          retention-days: 30
          if-no-files-found: error

      - name: Upload to S3 (si está configurado)
        if: ${{ secrets.BACKUP_S3_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_AWS_REGION || 'us-east-1' }}
        run: |
          aws s3 cp \
            "backup-${{ steps.ts.outputs.stamp }}.pgdump" \
            "s3://${{ secrets.BACKUP_S3_BUCKET }}/dorado-lounge/$(date -u +%Y/%m)/backup-${{ steps.ts.outputs.stamp }}.pgdump" \
            --storage-class STANDARD_IA

      - name: Ping heartbeat on success
        if: success() && secrets.BETTERSTACK_BACKUP_HEARTBEAT_URL != ''
        run: curl --silent --fail "${{ secrets.BETTERSTACK_BACKUP_HEARTBEAT_URL }}" || true

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Backup FAILED at ${{ steps.ts.outputs.stamp }}"
          # Si se configura SLACK_WEBHOOK_URL o similar, agregar notificación aquí
