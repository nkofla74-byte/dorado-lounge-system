name: Database Backup

on:
  schedule:
    # Diario a las 03:00 UTC (22:00 hora Colombia)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Razón del backup manual'
        required: false
        default: 'Manual trigger'

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Supabase Backup → Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set timestamp
        id: ts
        run: echo "stamp=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - name: Export database via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python3 scripts/ci-backup.py "backup-${{ steps.ts.outputs.stamp }}.sql"

      - name: Verify backup is non-empty
        run: |
          SIZE=$(stat -c%s "backup-${{ steps.ts.outputs.stamp }}.sql")
          echo "Backup size: ${SIZE} bytes"
          if [ "$SIZE" -lt 1024 ]; then
            echo "::error::Backup file is suspiciously small (${SIZE} bytes)"
            exit 1
          fi

      - name: Compress
        run: gzip "backup-${{ steps.ts.outputs.stamp }}.sql"

      - name: Encrypt backup
        run: |
          gpg --batch --symmetric --cipher-algo AES256 \
            --passphrase "${{ secrets.BACKUP_GPG_PASSPHRASE }}" \
            "backup-${{ steps.ts.outputs.stamp }}.sql.gz"

      - name: Upload encrypted artifact (30 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: db-backup-${{ steps.ts.outputs.stamp }}
          path: backup-${{ steps.ts.outputs.stamp }}.sql.gz.gpg
          retention-days: 30
          if-no-files-found: error

      - name: Upload to S3 (si está configurado)
        if: ${{ vars.BACKUP_S3_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_AWS_REGION || 'us-east-1' }}
        run: |
          aws s3 cp \
            "backup-${{ steps.ts.outputs.stamp }}.sql.gz.gpg" \
            "s3://${{ vars.BACKUP_S3_BUCKET }}/dorado-lounge/$(date -u +%Y/%m)/backup-${{ steps.ts.outputs.stamp }}.sql.gz.gpg" \
            --storage-class STANDARD_IA

      - name: Ping heartbeat on success
        if: success() && vars.BETTERSTACK_BACKUP_HEARTBEAT_URL != ''
        run: curl --silent --fail "${{ vars.BETTERSTACK_BACKUP_HEARTBEAT_URL }}" || true

      - name: Notify failure
        if: failure()
        run: echo "::error::Backup FAILED at ${{ steps.ts.outputs.stamp }}"
