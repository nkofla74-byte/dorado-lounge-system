name: Heartbeat

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # permite dispararlo manualmente para verificar

jobs:
  ping:
    name: Ping Better Stack
    runs-on: ubuntu-latest
    steps:
      - name: Ping heartbeat
        run: |
          if [ -z "${{ secrets.BETTERSTACK_HEARTBEAT_URL }}" ]; then
            echo "BETTERSTACK_HEARTBEAT_URL no configurado — skipping"
            exit 0
          fi
          curl --silent --fail "${{ secrets.BETTERSTACK_HEARTBEAT_URL }}"
