name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  # Gate: solo deploy si CI pasó
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - run: echo "CI passed — proceeding with deploy"

  # NO hay job de migraciones aquí, y es deliberado (H-1, 2026-08-25).
  #
  # Las migraciones las aplica la integración nativa de Supabase con GitHub al
  # fusionar en `main`. Durante dos meses y medio convivieron los dos caminos:
  # `schema_migrations` demuestra que el workflow no aplicaba nada desde el
  # 2026-06-11 (53 filas con created_by='ci-pipeline') y que desde el
  # 2026-06-12 aplica la integración (17 filas con created_by nulo). Dos
  # mecanismos escribiendo el esquema sin saber el uno del otro.
  #
  # El gate de CI que protegía este job era decorativo: la integración aplica
  # al fusionar, antes de que este workflow arranque. El gate real es la
  # protección de rama sobre `main`, que exige CI en verde para poder fusionar
  # — si nada rojo se fusiona, nada rojo se aplica.
  #
  # El orden sigue siendo el correcto: la integración aplica el esquema al
  # fusionar y el deploy de la app ocurre minutos después, tras CI. Base
  # primero, aplicación después.
  #
  # Ver docs/remediacion/ARCHITECTURE_DECISIONS.md §ADR-007.

  deploy-web:
    name: Deploy Web (Vercel)
    runs-on: ubuntu-latest
    needs: [gate]
    environment:
      name: production
      url: https://dorado-lounge-system-web.vercel.app
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@54.11.1

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  notify-sentry:
    name: Sentry Release
    runs-on: ubuntu-latest
    needs: [deploy-web]
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Create Sentry release
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          sourcemaps: apps/web/.next
